server:
  port: 8082
spring:
  application:
    name: user-service
app:
  version: v1
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    metadata-map:
      version: ${app.version}
